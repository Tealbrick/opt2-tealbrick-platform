# C56 D1: daily check that every opt2 repo uses a template >= ci/MIN_TEMPLATE. Red = some repo must re-adopt.
when:
  - event: cron
    cron: template-audit
  - event: manual

steps:
  - name: template-audit
    image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    commands:
      - node ci/tb-ci.ts audit-templates
