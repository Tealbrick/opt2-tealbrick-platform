# opt2 release on Woodpecker (template ci-v9.15, C222 + C232). GENERATED from Tealbrick/opt2-tealbrick-platform: ci/woodpecker/release.yaml.
# Do not edit in a repo: the ci workflow's setup step fails on drift. Only in repos with "releaseOn": "woodpecker" in
# tealbrick-ci.json (private repos: GitHub Actions do not start there without billing, C222). Same split as the Actions release:
#   release-build      — runs repo code (install, build, pack script / npm pack, pack guard). NO secret in this step.
#   release-image      — ci-v9.11: kaniko builds each configured image from the tagged commit (linux/amd64, --no-push, a tarball in
#                        .tb-ci/out). Runs the repo's Dockerfile, so it is repo code: NO secret, no registry login.
#   release-image-push — ci-v9.11: runs NO repo code. A fresh hash-checked runner in /tmp pushes the tarballs with a hash-checked crane
#                        binary to ghcr.io/<owner>/<image>:<version>, never overwrites a tag that points to another digest, writes
#                        .tb-ci/out/<image>.digest. Only step with the repo secret tb_ghcr_token (classic PAT, write:packages only, of a
#                        machine user that can write the one package; events tag + manual; no image filter).
#   release-publish    — runs NO repo code: a fresh hash-checked runner in /tmp reads .tb-ci/out as data, checks that the tag
#                        exists on GitHub at the planned commit, then attaches the tarballs + .sha256 + .integrity and, for images,
#                        release-candidate.json (image@digest) to the release.
#                        Only step with the repo secret tb_release_token (fine-grained token, Contents: write on THIS repo only;
#                        secret events: tag + manual; no image filter, Woodpecker refuses image filters on command steps).
# It never creates or moves a tag and never replaces a published asset (same bytes = skip, other bytes = red).
# Re-release an existing tag on this template (e.g. a tag cut before the repo adopted it): manual pipeline on main with the
# variable TB_RELEASE_TAG=<tag>. The platform signer (registry-sync) still verifies everything (E1 guard, bytes, products, image labels).
labels:
  platform: linux/amd64

when:
  - event: tag
    ref: refs/tags/v*
  - event: tag
    ref: refs/tags/*-v*
  - event: manual
    branch: main
    evaluate: '(TB_RELEASE_TAG ?? "") != ""'

depends_on: [ci]

clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      tags: true

steps:
  - name: release-build
    image: &node node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      CI: "true"
      TB_CI_REF: ci-v9.15
      TB_CI_SHA256: "5cfcfd3870d2fca8734548854b9575222ec3abbb64f9993d0862f4b968f58032"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    commands:
      - mkdir -p .tb-ci
      - curl -fsSL "https://raw.githubusercontent.com/Tealbrick/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o .tb-ci/tb-ci.ts
      - echo "$TB_CI_SHA256  .tb-ci/tb-ci.ts" | sha256sum -c -
      - node .tb-ci/tb-ci.ts wp-build

  - name: release-image
    image: &kaniko gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    depends_on: [release-build]
    commands:
      - sh .tb-ci/release-images.sh

  - name: release-image-push
    image: *node
    depends_on: [release-image]
    environment:
      CI: "true"
      TB_CI_REF: ci-v9.15
      TB_CI_SHA256: "5cfcfd3870d2fca8734548854b9575222ec3abbb64f9993d0862f4b968f58032"
      GHCR_TOKEN:
        from_secret: tb_ghcr_token
    commands:
      - set +x
      - OUT="$CI_WORKSPACE/.tb-ci/out"
      - cd /tmp
      - curl -fsSL "https://raw.githubusercontent.com/Tealbrick/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - TB_OUT="$OUT" node /tmp/tb-ci.ts wp-push

  - name: release-publish
    image: *node
    depends_on: [release-build, release-image-push]
    environment:
      CI: "true"
      TB_CI_REF: ci-v9.15
      TB_CI_SHA256: "5cfcfd3870d2fca8734548854b9575222ec3abbb64f9993d0862f4b968f58032"
      GITHUB_TOKEN:
        from_secret: tb_release_token
    commands:
      - OUT="$CI_WORKSPACE/.tb-ci/out"
      - cd /tmp
      - curl -fsSL "https://raw.githubusercontent.com/Tealbrick/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - TB_OUT="$OUT" node /tmp/tb-ci.ts wp-publish
